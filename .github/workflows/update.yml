name: Update fund data and deploy site

on:
  # A cron-job.org job starts this workflow through the API at 10:15
  # Istanbul time on weekdays (see README), because GitHub starts scheduled
  # runs hours late. This schedule (12:37 Istanbul, Mon-Fri) is only a
  # fallback in case that call fails: it skips itself once today's data is in.
  schedule:
    - cron: "37 9 * * 1-5"
  workflow_dispatch:
  # Pushes to main redeploy the site with the data already in the repo.
  push:
    branches: [main]

# Never run two updates/deploys at once; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the refreshed data file
    outputs:
      skip: ${{ steps.today.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      # Read the data file from the tip of the branch, not the checkout: this
      # run may have been queued before the 10:15 run committed.
      - name: Check whether today's data is already in
        id: today
        if: github.event_name == 'schedule'
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_REF_NAME"
          fetched_at=$(git show FETCH_HEAD:site/data/funds.json \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["fetchedAt"])')
          if [ "$(TZ=Europe/Istanbul date -d "$fetched_at" +%F)" = "$(TZ=Europe/Istanbul date +%F)" ]; then
            echo "Data was already fetched today ($fetched_at); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch fund returns from TEFAS
        if: github.event_name != 'push' && steps.today.outputs.skip != 'true'
        run: python3 scripts/fetch_funds.py site/data/funds.json

      - name: Commit updated data
        if: github.event_name != 'push' && steps.today.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # previous.json is the last earlier day's funds.json (see fetch_funds.py);
          # it is missing only until the first update over an earlier day's data.
          git add site/data/funds.json
          if [ -f site/data/previous.json ]; then git add site/data/previous.json; fi
          if git diff --cached --quiet; then
            echo "Fund data unchanged."
            exit 0
          fi
          git commit -m "Update TEFAS fund data ($(TZ=Europe/Istanbul date +%F))"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/upload-pages-artifact@v5
        if: steps.today.outputs.skip != 'true'
        with:
          path: site

  # On the fallback run, tell the owner when cron-job.org didn't start the
  # 10:15 run (usually an expired token, see README). This job is separate
  # from build and deploy, so its failure never holds back the data update.
  trigger-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out scripts/check_trigger.py
      actions: read # list this workflow's runs
      issues: write # open, comment on or close the alert issue
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: trigger-missed
    steps:
      - uses: actions/checkout@v7

      - name: Check whether the 10:15 trigger started a run
        id: check
        run: |
          gh run list --workflow update.yml --event workflow_dispatch \
            --limit 20 --json createdAt,event > "$RUNNER_TEMP/runs.json"
          gh issue list --label "$LABEL" --state open --json number \
            > "$RUNNER_TEMP/issues.json"
          python3 scripts/check_trigger.py \
            "$RUNNER_TEMP/runs.json" "$RUNNER_TEMP/issues.json" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --readme-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY#daily-trigger-cron-joborg" \
            --message-file "$RUNNER_TEMP/message.md" >> "$GITHUB_OUTPUT"

      - name: Open an issue about the missed trigger
        if: steps.check.outputs.action == 'open'
        run: |
          gh label create "$LABEL" --color D93F0B \
            --description "The 10:15 cron-job.org trigger didn't start the update" \
            2>/dev/null || true
          gh issue create --label "$LABEL" \
            --title "⚠️ The 10:15 daily trigger didn't run" \
            --body-file "$RUNNER_TEMP/message.md"

      - name: Comment on the open missed-trigger issue
        if: steps.check.outputs.action == 'comment'
        run: gh issue comment "${{ steps.check.outputs.issue }}" --body-file "$RUNNER_TEMP/message.md"

      - name: Close the missed-trigger issue
        if: steps.check.outputs.action == 'close'
        run: |
          gh issue comment "${{ steps.check.outputs.issue }}" --body-file "$RUNNER_TEMP/message.md"
          gh issue close "${{ steps.check.outputs.issue }}"

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
