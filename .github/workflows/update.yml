name: Update fund data and deploy site

on:
  schedule:
    # 08:00 UTC = 11:00 in Türkiye (UTC+3). GitHub may start scheduled runs
    # a few minutes late.
    - cron: "0 8 * * *"
  workflow_dispatch:
  # Pushes to main redeploy the site with the data already in the repo.
  push:
    branches: [main]

# Never run two updates/deploys at once; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the refreshed data file
    steps:
      - uses: actions/checkout@v7

      - name: Fetch fund returns from TEFAS
        if: github.event_name != 'push'
        run: python3 scripts/fetch_funds.py site/data/funds.json

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/funds.json
          if git diff --cached --quiet; then
            echo "Fund data unchanged."
            exit 0
          fi
          git commit -m "Update TEFAS fund data ($(TZ=Europe/Istanbul date +%F))"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
