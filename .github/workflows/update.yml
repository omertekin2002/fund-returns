name: Update fund data and deploy site

on:
  # A cron-job.org job starts this workflow through the API at 10:15
  # Istanbul time on weekdays (see README), because GitHub starts scheduled
  # runs hours late. This schedule (12:37 Istanbul, Mon-Fri) is only a
  # fallback in case that call fails: it skips itself once today's data is in
  # and live, and republishes today's committed data if its deploy failed.
  schedule:
    - cron: "37 9 * * 1-5"
  workflow_dispatch:
  # Pushes to main redeploy the site with the data already in the repo, once
  # the tests job below has passed.
  push:
    branches: [main]

# Never run two updates/deploys at once; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the refreshed data file
      actions: read # list the test runs (see "Choose the code to deploy")
      pages: read # look up the site's URL (see "Decide what the fallback does")
    outputs:
      skip: ${{ steps.today.outputs.action == 'skip' }}
    steps:
      - uses: actions/checkout@v7

      # On the fallback schedule, scripts/fallback_action.py compares the data
      # file at the tip of the branch (not the checkout: this run may have
      # been queued before the 10:15 run committed) with the one the live site
      # serves, and prints action=fetch (no edition for today yet), skip
      # (today's edition is committed and live) or recover (today's edition
      # is committed but its deploy failed: republish it without fetching).
      # A failed probe of the site means recover; redeploying is harmless.
      - name: Decide what the fallback does
        id: today
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_REF_NAME"
          git show FETCH_HEAD:site/data/funds.json > "$RUNNER_TEMP/committed.json"
          echo "tip=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"

          # The site's URL from the API, or else the default Pages URL.
          pages_url=$(timeout 20 gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)
          if [ -z "$pages_url" ]; then
            owner=${GITHUB_REPOSITORY_OWNER,,}
            repo=${GITHUB_REPOSITORY#*/}
            if [ "${repo,,}" = "$owner.github.io" ]; then
              pages_url="https://$owner.github.io/"
            else
              pages_url="https://$owner.github.io/$repo/"
            fi
          fi
          live_url="${pages_url%/}/data/funds.json?fallback=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(date +%s)"
          echo "Live data: $live_url"
          rm -f "$RUNNER_TEMP/live.json"
          if ! curl --fail --silent --show-error --location --max-time 20 \
              --header "Cache-Control: no-cache" \
              --output "$RUNNER_TEMP/live.json" "$live_url"; then
            echo "Couldn't read the live data file."
            rm -f "$RUNNER_TEMP/live.json"
          fi

          python3 scripts/fallback_action.py "$RUNNER_TEMP/committed.json" \
            --live "$RUNNER_TEMP/live.json" | tee -a "$GITHUB_OUTPUT"

      # Recover: deploy today's committed data with the code the data runs
      # would deploy, through "Choose the code to deploy" below. Nothing is
      # fetched or committed, so a second recovery deploys the same bundle.
      - name: Use the committed edition
        if: steps.today.outputs.action == 'recover'
        env:
          TIP: ${{ steps.today.outputs.tip }}
          LIVE: ${{ steps.today.outputs.live }}
          COMMITTED: ${{ steps.today.outputs.committed }}
        run: |
          git reset --quiet --hard "$TIP"
          if [ -n "$LIVE" ]; then
            live="the site serves the data fetched at $LIVE"
          else
            live="the site's data file couldn't be read"
          fi
          msg="Today's data (fetched at $COMMITTED) is committed but $live, so this run republishes the committed data without fetching. The deploy after today's data commit probably failed."
          echo "::warning title=Republished today's data::$msg"
          {
            echo "### Republished today's data"
            echo
            echo "$msg"
            echo
            echo "Committed data: \`$(git rev-parse --short HEAD)\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch fund returns from TEFAS
        if: github.event_name == 'workflow_dispatch' || steps.today.outputs.action == 'fetch'
        run: python3 scripts/fetch_funds.py site/data/funds.json

      - name: Commit updated data
        if: github.event_name == 'workflow_dispatch' || steps.today.outputs.action == 'fetch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # previous.json is the last earlier day's funds.json (see fetch_funds.py);
          # it is missing only until the first update over an earlier day's data.
          git add site/data/funds.json
          if [ -f site/data/previous.json ]; then git add site/data/previous.json; fi
          if git diff --cached --quiet; then
            echo "Fund data unchanged."
            exit 0
          fi
          git commit -m "Update TEFAS fund data ($(TZ=Europe/Istanbul date +%F))"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # Data runs don't run the tests, so that a test failure never holds
      # back the data, but they mustn't deploy code whose tests failed either.
      # (A fallback recovery is a data run without the fetch and commit.)
      # scripts/deploy_source.py finds the last commit whose push run of the
      # tests passed. If only site/data/ changed since, this deploys the tip as
      # usual; otherwise it deploys site/ from that commit with today's
      # site/data/ and warns. The data commit pushed above is the same either
      # way. Any error here leaves the path output unset, so the tip is
      # deployed as before (see the next step): the data must still go out.
      - name: Choose the code to deploy
        id: source
        if: github.event_name != 'push' && steps.today.outputs.action != 'skip'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout is shallow; the green commit may be further back.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --quiet --unshallow origin "$GITHUB_REF_NAME"
          fi
          git rev-list --first-parent --max-count=500 HEAD > "$RUNNER_TEMP/commits.txt"
          # update.yml's push runs run the same tests before deploying, and
          # may finish before test.yml's run for the same commit.
          for workflow in test.yml update.yml; do
            gh run list --workflow "$workflow" --branch "$GITHUB_REF_NAME" \
              --event push --limit 100 --json headSha,conclusion,status \
              > "$RUNNER_TEMP/runs-$workflow.json"
          done
          python3 scripts/deploy_source.py \
            "$RUNNER_TEMP/runs-test.yml.json" "$RUNNER_TEMP/runs-update.yml.json" \
            --commits "$RUNNER_TEMP/commits.txt" > "$RUNNER_TEMP/source.txt"
          source=$(sed -n 's/^source=//p' "$RUNNER_TEMP/source.txt")
          tip=$(sed -n 's/^tip=//p' "$RUNNER_TEMP/source.txt")
          green=$(sed -n 's/^green=//p' "$RUNNER_TEMP/source.txt")
          warning=$(sed -n 's/^warning=//p' "$RUNNER_TEMP/source.txt")

          path=site
          if [ "$source" = green ]; then
            deploy="$RUNNER_TEMP/deploy"
            rm -rf "$deploy"
            mkdir -p "$deploy"
            git archive "$green" site | tar -x -C "$deploy"
            rm -rf "$deploy/site/data"
            cp -R site/data "$deploy/site/data"
            path="$deploy/site"
          fi

          {
            echo "### Deployed code"
            echo
            if [ "$source" = green ]; then
              echo "\`site/\` from \`$green\` with \`site/data/\` from the tip \`$tip\`."
            else
              echo "\`site/\` from the tip \`$tip\` (last commit whose tests passed: \`${green:-none found}\`)."
            fi
            if [ -n "$warning" ]; then echo; echo "⚠️ $warning"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$warning" ]; then echo "::warning title=Deployed code::$warning"; fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Warn that the tip is deployed unchecked
        if: steps.source.outcome == 'failure'
        run: |
          msg="Couldn't check which code passed its tests (see the \"Choose the code to deploy\" step), so this run deploys site/ from the tip $(git rev-parse --short HEAD), as data runs did before."
          echo "::warning title=Deployed code::$msg"
          echo "⚠️ $msg" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        if: steps.today.outputs.action != 'skip'
        with:
          path: ${{ steps.source.outputs.path || 'site' }}

  # On the fallback run, tell the owner when cron-job.org didn't start the
  # 10:15 run (usually an expired token, see README). This job is separate
  # from build and deploy, so its failure never holds back the data update.
  trigger-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out scripts/check_trigger.py
      actions: read # list this workflow's runs
      issues: write # open, comment on or close the alert issue
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: trigger-missed
    steps:
      - uses: actions/checkout@v7

      - name: Check whether the 10:15 trigger started a run
        id: check
        run: |
          gh run list --workflow update.yml --event workflow_dispatch \
            --limit 20 --json createdAt,event > "$RUNNER_TEMP/runs.json"
          gh issue list --label "$LABEL" --state open --json number \
            > "$RUNNER_TEMP/issues.json"
          python3 scripts/check_trigger.py \
            "$RUNNER_TEMP/runs.json" "$RUNNER_TEMP/issues.json" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --readme-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY#daily-trigger-cron-joborg" \
            --message-file "$RUNNER_TEMP/message.md" >> "$GITHUB_OUTPUT"

      - name: Open an issue about the missed trigger
        if: steps.check.outputs.action == 'open'
        run: |
          gh label create "$LABEL" --color D93F0B \
            --description "The 10:15 cron-job.org trigger didn't start the update" \
            2>/dev/null || true
          gh issue create --label "$LABEL" \
            --title "⚠️ The 10:15 daily trigger didn't run" \
            --body-file "$RUNNER_TEMP/message.md"

      - name: Comment on the open missed-trigger issue
        if: steps.check.outputs.action == 'comment'
        run: gh issue comment "${{ steps.check.outputs.issue }}" --body-file "$RUNNER_TEMP/message.md"

      - name: Close the missed-trigger issue
        if: steps.check.outputs.action == 'close'
        run: |
          gh issue comment "${{ steps.check.outputs.issue }}" --body-file "$RUNNER_TEMP/message.md"
          gh issue close "${{ steps.check.outputs.issue }}"

  # On pushes to main (code changes), run the unit and page tests and the
  # workflow lint from test.yml before deploying. Data runs (schedule, workflow_dispatch) skip
  # this so that a test failure never holds back the daily data; instead the
  # build job's "Choose the code to deploy" step deploys only code whose tests
  # passed on an earlier push.
  tests:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  # Deploys when build succeeded and didn't skip itself, and tests passed or
  # was skipped (data runs). `!cancelled()` lets this job run when tests was
  # skipped; without it, a skipped job in `needs` would skip deploy too.
  deploy:
    needs: [build, tests]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.build.outputs.skip != 'true'
      && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
