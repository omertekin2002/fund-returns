name: Tests

# Runs `npm test` (the filter, Sharpe ratio and fetch script tests) and
# `npm run test:e2e` (the page in headless Chromium) on every pull request and
# on pushes to main. update.yml also calls it on pushes to main, so that a code
# change is deployed only after both jobs pass. It only reads the repository.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 20 is the oldest version the README supports.
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # The fetch script tests use the runner's python3, as update.yml does.
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Installs the Playwright version pinned in package-lock.json, then the
      # Chromium build that version expects. The page is served with the
      # runner's python3.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
