name: Tests

# Runs `npm test` (the filter, Sharpe ratio and fetch script tests),
# `npm run test:e2e` (the page in headless Chromium) and actionlint over the
# workflows on every pull request and on pushes to main. update.yml also calls
# it on pushes to main, so that a code change is deployed only after all three
# jobs pass. It only reads the repository.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 22 is the oldest maintained LTS line, and the oldest version the
      # README (and package.json's engines field) supports.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The fetch script tests use the runner's python3, as update.yml does.
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Installs the Playwright version pinned in package-lock.json, then the
      # Chromium build that version expects. The page is served with the
      # runner's python3.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Checks both workflows with actionlint, which also runs shellcheck on every
  # `run:` block. Most of update.yml's data-run steps run only on schedule and
  # workflow_dispatch, which no PR exercises, so a typo in an `if:` expression
  # or a shell script would otherwise first show up at the next daily run.
  # The image bundles shellcheck. Dependabot doesn't update `docker://`
  # references, so the version is bumped by hand; run the same check locally
  # with the command in the README.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
